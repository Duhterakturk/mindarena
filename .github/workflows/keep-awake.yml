# Render'ın ücretsiz web servisi 15 dakika istek gelmezse uyur.
# Bu süre ayardan uzamaz. Beş dakikada bir sağlık ucuna dokunmak
# servisi uyanık tutar. Ayda tek servis, ücretsiz saatin içinde kalır.
name: Keep API awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: curl -fsS --retry 3 --retry-all-errors --retry-delay 5 --max-time 120 https://duhterakturk-mindarena-api.onrender.com/api/health
