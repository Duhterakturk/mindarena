name: Haftalık yedek

on:
  schedule:
    # Pazar 03:00 Türkiye (UTC+3, yaz saati yok) = Pazar 00:00 UTC
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Neon yedeği
    runs-on: ubuntu-latest
    steps:
      - name: Secret kontrolü
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${NEON_DATABASE_URL}" ]; then
            echo "::error::NEON_DATABASE_URL secret'i yok. GitHub'da repo Settings > Secrets and variables > Actions > New repository secret ile ekleyin."
            missing=1
          fi
          if [ -z "${BACKUP_PASSPHRASE}" ]; then
            echo "::error::BACKUP_PASSPHRASE secret'i yok. GitHub'da repo Settings > Secrets and variables > Actions > New repository secret ile ekleyin."
            missing=1
          fi
          exit "$missing"

      - name: PostgreSQL 17 istemcisi
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - name: Yedeği al ve şifrele
        id: dump
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          PGCONNECT_TIMEOUT: "60"
        run: |
          set -euo pipefail
          day="$(TZ=Europe/Istanbul date +%F)"
          plain="mindarena-yedek-${day}.dump"
          sealed="mindarena-yedek-${day}.dump.gpg"
          rm -f "$plain" "$sealed"
          cleanup() { rm -f "$plain"; }
          trap cleanup EXIT

          url="${NEON_DATABASE_URL}"
          case "$url" in
            postgresql+psycopg://*) url="postgresql://${url#postgresql+psycopg://}" ;;
            postgres+psycopg://*) url="postgresql://${url#postgres+psycopg://}" ;;
          esac
          echo "::add-mask::${url}"

          pg_dump -Fc --no-owner --no-acl --file="$plain" "$url"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --cipher-algo AES256 \
            --symmetric \
            --passphrase-fd 0 \
            --output "$sealed" \
            "$plain"
          rm -f "$plain"
          if [ -f "$plain" ]; then
            echo "::error::Şifresiz yedek silinemedi. Dosya yüklenmedi."
            exit 1
          fi
          echo "day=${day}" >> "$GITHUB_OUTPUT"
          echo "Şifreli yedek hazır: ${sealed}"

      - name: Şifreli yedeği yükle
        uses: actions/upload-artifact@v4
        with:
          name: mindarena-yedek-${{ steps.dump.outputs.day }}.dump.gpg
          path: mindarena-yedek-*.dump.gpg
          retention-days: 90
          if-no-files-found: error
